<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sample</title>
  <style>
    #container {
      background: #ccc;
      border: solid 1px #555;
      padding: 5px; /* 外层容器留白缩小 */
    }
    #box {
      height: 60px;
      width: 60px;
      background: #ffbcbc;
      border-style: solid;
      border-color: #999;
      /* 全部缩小，画面紧凑 */
      margin: 15px;
      border-width: 30px;
      border-radius: 40px;
      padding: 35px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="box">The quick brown fox jumps over the lazy dog</div>
  </div>
</body>
</html>
